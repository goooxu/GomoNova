_base_: base.yaml

model:
  channels: 64
  num_blocks: 4
  policy_channels: 32
  value_channels: 16

training:
  batch_size: 512
  lr: 2.0e-3
  lr_min: 1.0e-4
  warmup_iters: 3
  total_iters: 50
  train_steps_per_iter: 32
  weight_decay: 1.0e-4
  grad_clip: 1.0
  use_amp: true

selfplay:
  games_per_iter: 64
  temp_threshold: 20
  mcts_sims: 10
  mcts_moves: 5
  dirichlet_alpha: 0.3
  history_opponent_ratio: 0.0
  history_save_interval: 20
  history_keep: 3

replay:
  capacity: 200000

eval:
  games: 40
  promote_winrate: 0.55

phases:
  mcts_start: 10
  renju_start: 40
