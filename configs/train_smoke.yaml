_base_: base.yaml

model:
  channels: 32
  num_blocks: 2
  policy_channels: 16
  value_channels: 8

training:
  batch_size: 64
  lr: 2.0e-3
  lr_min: 1.0e-4
  warmup_iters: 1
  total_iters: 2
  train_steps_per_iter: 16
  weight_decay: 1.0e-4
  grad_clip: 1.0
  use_amp: false

selfplay:
  games_per_iter: 4
  temp_threshold: 10
  mcts_sims: 5
  mcts_moves: 3
  dirichlet_alpha: 0.3
  history_opponent_ratio: 0.0
  history_save_interval: 100
  history_keep: 2

replay:
  capacity: 10000

eval:
  games: 4
  promote_winrate: 0.55

phases:
  mcts_start: 1
  renju_start: 100
