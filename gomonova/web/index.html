<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连珠对弈 · GomoNova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0c111d;
    --bg-1: #101726;
    --surface: #161f31;
    --surface-2: #1b2639;
    --surface-3: #212e45;
    --border: rgba(126, 156, 209, 0.13);
    --border-strong: rgba(126, 156, 209, 0.28);
    --ink: #e9eef8;
    --ink-dim: #94a1b8;
    --ink-faint: #5c6a84;
    --amber: #f6a723;
    --amber-soft: rgba(246, 167, 35, 0.14);
    --teal: #35d0b5;
    --teal-soft: rgba(53, 208, 181, 0.13);
    --red: #f0563f;
    --mono: 'JetBrains Mono', monospace;
    --disp: 'Space Grotesk', 'Noto Sans SC', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-0);
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }

  /* ---------- ambient layered background ---------- */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(140, 170, 220, 0.055) 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(720px 520px at 10% 6%, rgba(246, 167, 35, 0.07), transparent 62%),
      radial-gradient(820px 620px at 92% 96%, rgba(53, 208, 181, 0.06), transparent 62%),
      radial-gradient(1300px 900px at 50% 45%, transparent 55%, rgba(4, 7, 14, 0.55) 100%);
    pointer-events: none; z-index: 0;
  }

  .app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    gap: 26px;
    height: 100vh;
    padding: 24px 28px;
    max-width: 1520px;
    margin: 0 auto;
  }

  /* ---------- board ---------- */
  .board-zone {
    display: flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0;
  }
  .board-frame {
    position: relative;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(150deg, #232f47, #172034);
    border: 1px solid var(--border-strong);
    box-shadow:
      0 34px 80px rgba(0, 0, 0, 0.6),
      0 6px 18px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(180, 205, 245, 0.08);
  }
  .board-frame::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 16px;
    pointer-events: none;
    box-shadow: 0 0 0 1px rgba(246, 167, 35, 0.0), 0 0 44px rgba(246, 167, 35, 0.0);
    transition: box-shadow 0.4s;
  }
  .board-frame.live::after {
    box-shadow: 0 0 0 1px rgba(246, 167, 35, 0.22), 0 0 48px rgba(246, 167, 35, 0.10);
  }
  #board { display: block; border-radius: 8px; cursor: crosshair; }

  /* ---------- panel ---------- */
  .panel {
    display: flex; flex-direction: column;
    gap: 14px;
    min-height: 0; overflow: hidden;
  }

  .card {
    background: linear-gradient(165deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px 17px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
  }

  /* brand */
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 52px; height: 52px; flex: none;
    border-radius: 12px;
    background: linear-gradient(150deg, var(--surface-3), #182238);
    border: 1px solid var(--border-strong);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 9px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(180,205,245,0.1);
  }
  .logo i {
    border-radius: 50%;
    background: rgba(140, 170, 220, 0.22);
    transition: transform 0.3s, background 0.3s;
  }
  .logo i.hot { background: var(--amber); box-shadow: 0 0 8px rgba(246,167,35,0.7); }
  .brand:hover .logo i.hot { transform: scale(1.25); }
  .brand h1 {
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 900; font-size: 26px; letter-spacing: 3px;
    line-height: 1.1;
  }
  .brand .tag {
    font-family: var(--disp);
    font-size: 10px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .brand .tag b { color: var(--amber); font-weight: 700; }

  /* players */
  .players { display: flex; flex-direction: column; gap: 8px; }
  .player {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.015);
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  .player.active {
    border-color: rgba(246, 167, 35, 0.55);
    background: var(--amber-soft);
    box-shadow: 0 0 0 1px rgba(246,167,35,0.2), 0 4px 16px rgba(246,167,35,0.08);
  }
  .player.active.ai-turn {
    border-color: rgba(53, 208, 181, 0.5);
    background: var(--teal-soft);
    box-shadow: 0 0 0 1px rgba(53,208,181,0.2), 0 4px 16px rgba(53,208,181,0.08);
  }
  .stone-ico {
    width: 30px; height: 30px; flex: none; border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .stone-ico.black { background: radial-gradient(circle at 35% 30%, #5a6478, #0b0e16 72%); border: 1px solid rgba(150,172,214,0.35); }
  .stone-ico.white { background: radial-gradient(circle at 35% 30%, #ffffff, #b9c6da 78%); }
  .p-info { flex: 1; min-width: 0; }
  .p-name { font-weight: 700; font-size: 15px; letter-spacing: 1px; }
  .p-sub { font-size: 11px; color: var(--ink-dim); margin-top: 1px; letter-spacing: 1px; }
  .chip {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    letter-spacing: 1px;
    padding: 4px 10px; border-radius: 999px;
    color: var(--ink-faint);
    border: 1px solid var(--border);
    white-space: nowrap;
    transition: all 0.3s;
  }
  .player.active .chip { color: var(--amber); border-color: rgba(246,167,35,0.5); background: rgba(246,167,35,0.1); }
  .player.active.ai-turn .chip { color: var(--teal); border-color: rgba(53,208,181,0.5); background: rgba(53,208,181,0.1); }
  .chip.think::after {
    content: ''; display: inline-block; width: 12px; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* eval */
  .eval-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 11px;
  }
  .eval-head .lbl { font-size: 11px; letter-spacing: 3px; color: var(--ink-dim); }
  .eval-val { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--ink); }
  .eval-bar {
    position: relative; height: 12px; border-radius: 6px; overflow: hidden;
    background: linear-gradient(90deg, #e9eef8, #c3cfe0);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  }
  .eval-black {
    position: absolute; left: 0; top: 0; bottom: 0; width: 50%;
    background: linear-gradient(90deg, #0b0e16, #333d52);
    transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .eval-bar .mid {
    position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px;
    transform: translateX(-50%); background: rgba(246,167,35,0.6);
  }
  .eval-ends { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-faint); margin-top: 6px; letter-spacing: 2px; }

  /* controls */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .btn {
    font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: 3px; padding: 11px 0;
    border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border-strong);
    background: linear-gradient(160deg, var(--surface-3), #1a2438);
    color: var(--ink);
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .btn:hover { transform: translateY(-2px); border-color: rgba(140,170,220,0.5); box-shadow: 0 8px 18px rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn.primary {
    background: linear-gradient(150deg, #f7b13a, #e08c10);
    border-color: rgba(255,255,255,0.2);
    color: #241a05; font-weight: 700;
  }
  .btn.primary:hover { box-shadow: 0 8px 22px rgba(246,167,35,0.35); }

  .seg { display: flex; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-strong); }
  .seg-opt {
    flex: 1; padding: 9px 0; cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif; font-size: 13px; letter-spacing: 2px;
    background: transparent; border: none; color: var(--ink-dim);
    transition: all 0.25s;
  }
  .seg-opt + .seg-opt { border-left: 1px solid var(--border-strong); }
  .seg-opt.active { background: var(--amber-soft); color: var(--amber); font-weight: 700; }

  /* history */
  .history-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .h-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .h-head .lbl { font-size: 11px; letter-spacing: 3px; color: var(--ink-dim); }
  .h-head .cnt { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .history {
    flex: 1; overflow-y: auto; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px;
    padding-right: 6px;
  }
  .history::-webkit-scrollbar { width: 5px; }
  .history::-webkit-scrollbar-thumb { background: rgba(126,156,209,0.25); border-radius: 3px; }
  .mv {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    font-family: var(--mono); font-size: 12.5px; color: var(--ink-dim);
    padding: 4px 9px; border-radius: 6px;
    border-left: 2px solid transparent;
    animation: mv-in 0.3s ease both;
  }
  @keyframes mv-in { from { opacity: 0; transform: translateX(-7px); } to { opacity: 1; transform: none; } }
  .mv-main { display: flex; align-items: center; gap: 8px; }
  .mv .n { color: var(--ink-faint); width: 24px; flex: none; }
  .mv .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .mv .dot.b { background: radial-gradient(circle at 35% 30%, #5a6478, #0b0e16 72%); border: 1px solid rgba(150,172,214,0.3); }
  .mv .dot.w { background: radial-gradient(circle at 35% 30%, #fff, #b9c6da 78%); }
  .mv-prob {
    font-size: 10px; color: var(--amber); font-weight: 600;
    margin-left: 7px; opacity: 0.9;
  }
  .mv-alts {
    font-size: 9.5px; color: var(--teal); opacity: 0.8;
    padding-left: 32px; letter-spacing: 0.3px; line-height: 1.3;
  }
  .mv.latest { background: var(--amber-soft); border-left-color: var(--amber); color: var(--ink); }

  .rule-note {
    font-size: 11px; color: var(--ink-faint); line-height: 1.7;
    padding: 0 4px; letter-spacing: 0.5px;
  }
  .rule-note b { color: var(--red); font-weight: 600; }

  @media (max-width: 1020px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; height: auto; }
    .board-zone { order: 1; }
    .panel { order: 2; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="board-zone">
    <div class="board-frame" id="boardFrame">
      <canvas id="board"></canvas>
    </div>
  </div>

  <aside class="panel">
    <div class="card brand">
      <div class="logo">
        <i></i><i></i><i></i><i></i><i class="hot"></i><i></i><i></i><i></i><i></i>
      </div>
      <div>
        <h1>连珠对弈</h1>
        <div class="tag">Gomo<b>Nova</b> &middot; Renju AI</div>
      </div>
    </div>

    <div class="card players">
      <div class="player" id="playerYou">
        <div class="stone-ico black" id="youStone"></div>
        <div class="p-info">
          <div class="p-name">你</div>
          <div class="p-sub" id="youSub">执黑 · 先行</div>
        </div>
        <div class="chip" id="youChip">落子</div>
      </div>
      <div class="player" id="playerAI">
        <div class="stone-ico white" id="aiStone"></div>
        <div class="p-info">
          <div class="p-name">GomoNova</div>
          <div class="p-sub" id="aiSub">执白 · 后行</div>
        </div>
        <div class="chip" id="aiChip">待命</div>
      </div>
    </div>

    <div class="card">
      <div class="eval-head">
        <span class="lbl">形势评估</span>
        <span class="eval-val" id="valueText">—</span>
      </div>
      <div class="eval-bar">
        <div class="eval-black" id="blackFill"></div>
        <div class="mid"></div>
      </div>
      <div class="eval-ends"><span>黑 BLACK</span><span>白 WHITE</span></div>
    </div>

    <div class="card">
      <div class="controls">
        <button class="btn primary" id="btnNew">新对局</button>
        <button class="btn" id="btnUndo">悔 棋</button>
        <button class="btn" id="btnHint">提 示</button>
        <button class="btn" id="btnResign">认 输</button>
      </div>
      <div class="seg" style="margin-top:10px">
        <button class="seg-opt active" id="optBlack">执黑先行</button>
        <button class="seg-opt" id="optWhite">执白后行</button>
      </div>
    </div>

    <div class="card history-card">
      <div class="h-head"><span class="lbl">棋 谱</span><span class="cnt" id="moveCount">0 手</span></div>
      <div class="history" id="history"></div>
    </div>

    <div class="rule-note">连珠规则：黑棋<b>禁手</b>（三三 / 四四 / 长连）落子即判负，双方一致。AI 落子为纯模型输出。</div>
  </aside>
</div>

<script>
'use strict';

const SIZE = 15, CELLS = SIZE * SIZE;
const COLS = 'ABCDEFGHIJKLMNO';
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let moves = [];
let humanColor = 1;
let status = 'playing';
let winLine = [];
let forbiddenPos = null;
let hints = [];
let hoverPos = null;
let thinking = false;
let placedAt = {};
let aiAlternatives = {};   // moveIndex -> [[pos, prob], [pos, prob]] (2nd & 3rd choices)
let boardTex = null;
let geom = { cell: 0, off: 0, px: 0 };

// ---------- board texture (modern slate) ----------
function makeBoardTexture(px) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, px, px);
  grad.addColorStop(0, '#28344e');
  grad.addColorStop(0.5, '#222d44');
  grad.addColorStop(1, '#1c2638');
  g.fillStyle = grad;
  g.fillRect(0, 0, px, px);
  for (let i = 0; i < 500; i++) {
    g.fillStyle = `rgba(${Math.random() > 0.5 ? '160,185,225' : '8,12,22'}, ${Math.random() * 0.05})`;
    g.fillRect(Math.random() * px, Math.random() * px, 1.4, 1.4);
  }
  const v = g.createRadialGradient(px/2, px/2, px*0.3, px/2, px/2, px*0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(5,8,15,0.4)');
  g.fillStyle = v;
  g.fillRect(0, 0, px, px);
  return c;
}

// ---------- geometry ----------
function resize() {
  const zone = document.querySelector('.board-zone');
  // 纵向堆叠布局（≤1020px，.app 为 height:auto）下 zone 高度由内容决定，与画布
  // 尺寸循环依赖而塌陷，min(宽,高) 会取到塌陷高度、被 300px 下限钉死撑不满宽，
  // 故此时按宽度取；横向布局（.app 为 height:100vh）高度定义良好，仍取宽高较小者。
  const stacked = window.matchMedia('(max-width: 1020px)').matches;
  const limit = stacked ? zone.clientWidth : Math.min(zone.clientWidth, zone.clientHeight);
  const avail = limit - 24;
  const px = Math.max(300, avail);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = px * dpr; canvas.height = px * dpr;
  canvas.style.width = px + 'px'; canvas.style.height = px + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  geom.px = px; geom.off = px * 0.052;
  geom.cell = (px - 2 * geom.off) / (SIZE - 1);
  if (!boardTex || Math.abs(boardTex.width - px) > 40) boardTex = makeBoardTexture(px);
}
function posToXY(pos) {
  const r = Math.floor(pos / SIZE), c = pos % SIZE;
  return [geom.off + c * geom.cell, geom.off + r * geom.cell];
}
function xyToPos(x, y) {
  const c = Math.round((x - geom.off) / geom.cell);
  const r = Math.round((y - geom.off) / geom.cell);
  if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return null;
  return r * SIZE + c;
}

// ---------- stone ----------
function drawStone(x, y, radius, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  if (color === 2) { ctx.shadowColor = 'rgba(215,230,252,0.32)'; ctx.shadowBlur = radius * 0.55; }
  else { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = radius * 0.45; }
  const g = ctx.createRadialGradient(x - radius*0.35, y - radius*0.35, radius*0.1, x, y, radius);
  if (color === 1) { g.addColorStop(0, '#4d576c'); g.addColorStop(0.5, '#242b3c'); g.addColorStop(1, '#0a0d15'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#e9eef7'); g.addColorStop(1, '#b6c3d8'); }
  ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  if (color === 1) {
    ctx.beginPath(); ctx.arc(x, y, radius - 0.6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(150,172,214,0.38)';
    ctx.lineWidth = Math.max(1, radius * 0.055);
    ctx.stroke();
  }
  const s = ctx.createRadialGradient(x - radius*0.4, y - radius*0.45, 0, x - radius*0.4, y - radius*0.45, radius*0.5);
  s.addColorStop(0, color === 1 ? 'rgba(200,220,255,0.22)' : 'rgba(255,255,255,0.95)');
  s.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(x - radius*0.4, y - radius*0.45, radius*0.5, 0, Math.PI * 2);
  ctx.fillStyle = s; ctx.fill();
  ctx.restore();
}

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

// ---------- draw ----------
function draw(now) {
  const { px, off, cell } = geom;
  ctx.clearRect(0, 0, px, px);
  if (boardTex) ctx.drawImage(boardTex, 0, 0, px, px);

  // grid
  ctx.strokeStyle = 'rgba(168, 192, 232, 0.30)';
  ctx.lineWidth = Math.max(1, cell * 0.02);
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath(); ctx.moveTo(off, off + i*cell); ctx.lineTo(off + (SIZE-1)*cell, off + i*cell); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(off + i*cell, off); ctx.lineTo(off + i*cell, off + (SIZE-1)*cell); ctx.stroke();
  }
  // stars
  ctx.fillStyle = 'rgba(168, 192, 232, 0.55)';
  for (const [r, c] of [[3,3],[3,11],[7,7],[11,3],[11,11]]) {
    ctx.beginPath(); ctx.arc(off + c*cell, off + r*cell, cell*0.075, 0, Math.PI*2); ctx.fill();
  }
  // coords
  ctx.fillStyle = 'rgba(140, 165, 205, 0.5)';
  ctx.font = `600 ${Math.max(9, cell*0.28)}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < SIZE; i++) {
    ctx.fillText(COLS[i], off + i*cell, off*0.42);
    ctx.fillText(String(SIZE - i), off*0.4, off + i*cell);
  }

  const radius = cell * 0.44;

  // hover ghost
  if (hoverPos !== null && status === 'playing' && !thinking && humanTurn() && !moves.includes(hoverPos)) {
    const [hx, hy] = posToXY(hoverPos);
    drawStone(hx, hy, radius, humanColor, 0.32);
    ctx.beginPath(); ctx.arc(hx, hy, radius * 1.18, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(246,167,35,0.55)';
    ctx.lineWidth = Math.max(1.5, cell * 0.04);
    ctx.stroke();
  }

  // stones
  for (let i = 0; i < moves.length; i++) {
    const pos = moves[i];
    const [x, y] = posToXY(pos);
    const color = i % 2 === 0 ? 1 : 2;
    let scale = 1;
    const t0 = placedAt[pos];
    if (t0 !== undefined) {
      const t = (now - t0) / 220;
      if (t < 0) continue;
      scale = 0.5 + 0.5 * easeOutBack(Math.min(1, t));
      if (t >= 1) delete placedAt[pos];
    }
    drawStone(x, y, radius * scale, color, 1);
  }

  // last-move pulsing ring
  if (moves.length > 0 && forbiddenPos === null) {
    const [lx, ly] = posToXY(moves[moves.length - 1]);
    const pr = radius * (0.62 + 0.08 * Math.sin(now / 300));
    ctx.beginPath(); ctx.arc(lx, ly, pr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(246,167,35,0.85)';
    ctx.lineWidth = Math.max(2, cell * 0.055);
    ctx.stroke();
  }

  // hints
  for (let i = 0; i < hints.length; i++) {
    const [hx, hy] = posToXY(hints[i][0]);
    ctx.beginPath(); ctx.arc(hx, hy, radius * (0.66 - i * 0.13), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(53, 208, 181, ${0.9 - i * 0.28})`;
    ctx.lineWidth = Math.max(1.5, cell * 0.05);
    ctx.stroke();
  }

  // AI's top-k for its latest move: played prob + 2nd/3rd choices
  const lastTopK = aiAlternatives[moves.length - 1];
  if (lastTopK && status === 'playing') {
    // played move probability (amber, below the stone)
    const [sx, sy] = posToXY(moves[moves.length - 1]);
    ctx.fillStyle = 'rgba(246, 167, 35, 0.95)';
    ctx.font = `600 ${Math.max(9, cell * 0.24)}px 'JetBrains Mono', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((lastTopK[0][1] * 100).toFixed(0) + '%', sx, sy + radius * 1.95);

    // 2nd & 3rd choices (teal dashed rings with probability)
    lastTopK.slice(1, 3).forEach(([pos, prob], rank) => {
      const [ax, ay] = posToXY(pos);
      const op = rank === 0 ? 0.95 : 0.55;
      ctx.beginPath();
      ctx.arc(ax, ay, radius * 0.62, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(53, 208, 181, ${op})`;
      ctx.lineWidth = Math.max(1.5, cell * 0.045);
      ctx.setLineDash([cell * 0.12, cell * 0.08]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = `rgba(53, 208, 181, ${op})`;
      ctx.font = `600 ${Math.max(9, cell * 0.24)}px 'JetBrains Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((prob * 100).toFixed(0) + '%', ax, ay);
    });
  }

  // forbidden X
  if (forbiddenPos !== null) {
    const [fx, fy] = posToXY(forbiddenPos);
    const d = radius * 0.55;
    ctx.strokeStyle = '#f0563f';
    ctx.lineWidth = Math.max(2.5, cell * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx - d, fy - d); ctx.lineTo(fx + d, fy + d); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx + d, fy - d); ctx.lineTo(fx - d, fy + d); ctx.stroke();
  }

  // win line glow
  if (winLine.length >= 5) {
    const glow = 0.55 + 0.3 * Math.sin(now / 260);
    const [x0, y0] = posToXY(winLine[0]);
    const [x1, y1] = posToXY(winLine[winLine.length - 1]);
    ctx.save();
    ctx.strokeStyle = `rgba(246, 167, 35, ${glow})`;
    ctx.lineWidth = radius * 0.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(246, 167, 35, 0.85)';
    ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.restore();
  }
}

function loop(now) { draw(now); requestAnimationFrame(loop); }

// ---------- UI ----------
const youChip = document.getElementById('youChip');
const aiChip = document.getElementById('aiChip');
const playerYou = document.getElementById('playerYou');
const playerAI = document.getElementById('playerAI');
const boardFrame = document.getElementById('boardFrame');

function humanTurn() { return moves.length % 2 === (humanColor === 1 ? 0 : 1); }

function updatePlayers() {
  // stone icons + subs
  const youIsBlack = humanColor === 1;
  document.getElementById('youStone').className = 'stone-ico ' + (youIsBlack ? 'black' : 'white');
  document.getElementById('aiStone').className = 'stone-ico ' + (youIsBlack ? 'white' : 'black');
  document.getElementById('youSub').textContent = youIsBlack ? '执黑 · 先行' : '执白 · 后行';
  document.getElementById('aiSub').textContent = youIsBlack ? '执白 · 后行' : '执黑 · 先行';

  playerYou.classList.remove('active', 'ai-turn');
  playerAI.classList.remove('active', 'ai-turn');
  youChip.classList.remove('think'); aiChip.classList.remove('think');
  boardFrame.classList.remove('live');

  const gameOver = status !== 'playing';
  if (thinking) {
    playerAI.classList.add('active', 'ai-turn');
    aiChip.textContent = '思考中'; aiChip.classList.add('think');
    youChip.textContent = '待命';
    boardFrame.classList.add('live');
  } else if (!gameOver) {
    playerYou.classList.add('active');
    youChip.textContent = '落子';
    aiChip.textContent = '待命';
    boardFrame.classList.add('live');
  } else {
    youChip.textContent = '—'; aiChip.textContent = '—';
    if (status === 'human_win' || status === 'ai_forbidden') { youChip.textContent = '胜'; }
    if (status === 'ai_win' || status === 'human_forbidden' || status === 'resigned') { aiChip.textContent = '胜'; }
    if (status === 'draw') { youChip.textContent = '和'; aiChip.textContent = '和'; }
  }
}

function updateGauge(blackValue) {
  const fill = document.getElementById('blackFill');
  const txt = document.getElementById('valueText');
  if (blackValue === null || blackValue === undefined) {
    fill.style.width = '50%'; txt.textContent = '—'; return;
  }
  fill.style.width = ((blackValue + 1) / 2 * 100) + '%';
  txt.textContent = (blackValue >= 0 ? '黑 +' : '白 +') + Math.abs(blackValue).toFixed(2);
}

function updateHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '';
  for (let i = 0; i < moves.length; i++) {
    const pos = moves[i];
    const r = Math.floor(pos / SIZE), c = pos % SIZE;
    const color = i % 2 === 0 ? 1 : 2;
    const div = document.createElement('div');
    div.className = 'mv' + (i === moves.length - 1 ? ' latest' : '');

    let probHtml = '';
    let altHtml = '';
    const topk = aiAlternatives[i];
    if (topk && topk.length) {
      probHtml = `<span class="mv-prob">${(topk[0][1] * 100).toFixed(0)}%</span>`;
      const alts = topk.slice(1, 3);
      if (alts.length) {
        altHtml = `<span class="mv-alts">备 ${alts.map(([p, pr]) => {
          const ar = Math.floor(p / SIZE), ac = p % SIZE;
          return `${COLS[ac]}${SIZE - ar} ${(pr * 100).toFixed(0)}%`;
        }).join(' · ')}</span>`;
      }
    }

    div.innerHTML =
      `<span class="mv-main"><span class="n">${i + 1}.</span>` +
      `<span class="dot ${color === 1 ? 'b' : 'w'}"></span>${COLS[c]}${SIZE - r}${probHtml}</span>` +
      altHtml;
    el.appendChild(div);
  }
  document.getElementById('moveCount').textContent = moves.length + ' 手';
  el.scrollTop = el.scrollHeight;
}

// ---------- API ----------
async function apiPlay(humanMove) {
  const res = await fetch('/api/play', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ moves, human_move: humanMove, human_color: humanColor }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function apiHint() {
  const res = await fetch('/api/hint', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ moves }),
  });
  return res.json();
}

function applyResult(data) {
  const prevLen = moves.length;
  moves = data.moves;
  const now = performance.now();
  for (let i = prevLen; i < moves.length; i++) placedAt[moves[i]] = now + (i - prevLen) * 140;

  // record the AI's full top-k for its just-played move
  // top_k[0] = the played move (highest prob), top_k[1..2] = alternatives
  if (data.ai_move !== null && moves.length > 0 &&
      moves[moves.length - 1] === data.ai_move && data.top_k.length > 0) {
    aiAlternatives[moves.length - 1] = data.top_k;
  }

  status = data.status;
  winLine = data.win_line || [];
  forbiddenPos = data.forbidden_pos;
  hints = [];
  thinking = false;
  updateGauge(data.black_value);
  updateHistory();
  updatePlayers();
}

async function humanPlay(pos) {
  if (status !== 'playing' || thinking || !humanTurn()) return;
  hints = [];
  thinking = true; updatePlayers();
  try {
    applyResult(await apiPlay(pos));
  } catch (e) {
    thinking = false; updatePlayers();
  }
}
async function aiFirstMove() {
  thinking = true; updatePlayers();
  try {
    applyResult(await apiPlay(null));
  } catch (e) {
    thinking = false; updatePlayers();
  }
}

// ---------- events ----------
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  hoverPos = xyToPos(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener('mouseleave', () => { hoverPos = null; });
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const pos = xyToPos(e.clientX - rect.left, e.clientY - rect.top);
  if (pos !== null) humanPlay(pos);
});

document.getElementById('btnNew').addEventListener('click', () => newGame());
document.getElementById('btnUndo').addEventListener('click', () => {
  if (thinking || moves.length === 0) return;
  const remove = (moves.length % 2 === 0) ? 2 : 1;
  moves = moves.slice(0, Math.max(0, moves.length - remove));
  for (const k of Object.keys(aiAlternatives)) {
    if (Number(k) >= moves.length) delete aiAlternatives[k];
  }
  status = 'playing'; winLine = []; forbiddenPos = null; hints = [];
  updateHistory(); updatePlayers();
});
document.getElementById('btnHint').addEventListener('click', async () => {
  if (status !== 'playing' || thinking || !humanTurn()) return;
  hints = (await apiHint()).top_k;
});
document.getElementById('btnResign').addEventListener('click', () => {
  if (status !== 'playing') return;
  status = 'resigned'; updatePlayers();
});
document.getElementById('optBlack').addEventListener('click', () => setColor(1));
document.getElementById('optWhite').addEventListener('click', () => setColor(2));

function setColor(c) {
  humanColor = c;
  document.getElementById('optBlack').classList.toggle('active', c === 1);
  document.getElementById('optWhite').classList.toggle('active', c === 2);
  newGame();
}
function newGame() {
  moves = []; status = 'playing'; winLine = []; forbiddenPos = null;
  hints = []; placedAt = {}; aiAlternatives = {}; thinking = false;
  updateGauge(null); updateHistory(); updatePlayers();
  if (humanColor === 2) aiFirstMove();
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
newGame();
</script>
